name: Daily breakout screen (US + India)

on:
  schedule:
    # Both runs refresh BOTH markets; each run mainly matters for the market that just closed.
    # 11:40 UTC Mon-Fri = 17:10 IST: after the NSE close (15:30 IST)
    - cron: "40 11 * * 1-5"
    # 22:40 UTC Mon-Fri = 04:10 IST next morning: after the US close in summer and winter time
    - cron: "40 22 * * 1-5"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run screener
        run: python screener.py

      - name: Commit updated page
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Update screener results"
          git pull --rebase
          git push
