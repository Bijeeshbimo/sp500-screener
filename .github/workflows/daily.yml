name: Daily breakout screen (US + India)

on:
  schedule:
    # Each run refreshes BOTH markets; the page only screens a day once its candle is final
    # (15 min after the close, worked out from real closing times, so daylight saving is handled).
    # India: NSE closes 15:30 IST = 10:00 UTC. Run 10:30 UTC = 16:00 IST.
    - cron: "30 10 * * 1-5"
    # US: closes 20:00 UTC in summer time, 21:00 UTC in winter time, so there are two runs;
    # whichever one comes after the close does the work, the other simply changes nothing.
    - cron: "35 20 * * 1-5"
    - cron: "35 21 * * 1-5"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run screener
        run: python screener.py

      - name: Commit updated page
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Update screener results"
          git pull --rebase
          git push
