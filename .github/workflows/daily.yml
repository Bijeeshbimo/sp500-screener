name: Daily breakout screen (US + India)

on:
  schedule:
    # Scheduled runs on GitHub are best-effort and sometimes start late or get skipped, so each market
    # has several triggers after its close. A run with nothing new changes nothing (no commit, no banner).
    # The page only screens a day once its candle is final (15 min after the close; daylight saving is handled).
    # India: NSE closes 15:30 IST = 10:00 UTC  ->  16:00, 17:00 and 18:00 IST
    - cron: "30 10 * * 1-5"
    - cron: "30 11 * * 1-5"
    - cron: "30 12 * * 1-5"
    # US: closes 20:00 UTC in summer time, 21:00 UTC in winter time -> triggers for both
    - cron: "35 20 * * 1-5"
    - cron: "35 21 * * 1-5"
    - cron: "35 22 * * 1-5"
    - cron: "35 23 * * 1-5"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run screener
        run: python screener.py

      - name: Commit updated page
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Update screener results"
          git pull --rebase
          git push
