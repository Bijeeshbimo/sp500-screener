name: Build Android app

# Builds the Breakout Desk Android app (docs/app wrapped with Capacitor) and publishes the APK as a GitHub Release.
# Runs when the app's files change, or by hand: Actions tab -> "Build Android app" -> Run workflow.
# (The daily screener runs only touch docs/*.json, so they never trigger this.)
on:
  push:
    branches: [main]
    paths:
      - "docs/app/**"
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare the Android project
        working-directory: mobile
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          npm ci
          node scripts/prepare-android.mjs
          npx cap sync android

      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk BreakoutDesk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BreakoutDesk-apk
          path: BreakoutDesk.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-v${{ github.run_number }}" BreakoutDesk.apk \
            --title "Breakout Desk 1.0.${{ github.run_number }}" \
            --notes "Android app build ${{ github.run_number }}. Install over the previous version; your data is kept." \
            --latest
