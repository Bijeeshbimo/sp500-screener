name: Yahoo diagnostic
on:
  push:
    branches: [diag-yahoo]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python diag_yahoo.py
